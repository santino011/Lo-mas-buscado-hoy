name: Actualizar tendencias
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar sitio
        env:
          GEO: ${{ vars.GEO || 'AR' }}
          SITE: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          mkdir -p public data extras
          cp data/trends.json public/trends.json 2>/dev/null || true
          python3 generate.py --geo "$GEO" --site "$SITE" --out public
          cp public/trends.json data/trends.json
          rm public/trends.json
      - name: Guardar historial
        run: |
          git config user.name "trends-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/trends.json
          git diff --cached --quiet || (git commit -m "Actualiza tendencias" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        
